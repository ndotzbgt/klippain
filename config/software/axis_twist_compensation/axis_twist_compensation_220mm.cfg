# Axis twist compensation definition for a 220mm printer
# If this file is included, the [axis_twist_compensation] module is enabled and
# the dockable probe aware calibration wizard is activated.
# See docs/features/axis_twist_compensation.md for more information.
[gcode_macro _USER_VARIABLES]
variable_axis_twist_enabled: True
gcode:

# Include the calibration wizard plugin support and the convenience macros
[include ../../../macros/calibration/axis_twist_compensation.cfg]

# The compensation values themselves (z_compensations and the compensation
# start/end) are saved by the calibration wizard through SAVE_CONFIG into your
# printer.cfg. They must NOT be defined in this included file, otherwise
# SAVE_CONFIG will fail on the next calibration.
[axis_twist_compensation]
horizontal_move_z: 20
speed: 100
calibrate_start_x: 25
calibrate_end_x: 195
calibrate_y: 110
calibrate_start_y: 25
calibrate_end_y: 195
calibrate_x: 110

# The dockable probe aware wizard takes over the AXIS_TWIST_COMPENSATION_CALIBRATE
# command from the stock module (loaded after [axis_twist_compensation] on purpose).
[axis_twist_compensation_dockable]