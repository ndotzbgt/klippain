# Screws tilt leveling definition for a 250mm printer
# If this file is included, the [screws_tilt_adjust] section is defined and
# the dockable probe aware SCREWS_TILT_CALCULATE override is activated.
# Adapt the screw coordinates to the actual position of your bed screws!

# Also include directly the dockable probe override of SCREWS_TILT_CALCULATE from here
[include ../../../macros/base/probing/overrides/screws_tilt_calculate.cfg]


[screws_tilt_adjust]
screw1: 25,25
screw1_name: front left screw
screw2: 225,25
screw2_name: front right screw
screw3: 25,225
screw3_name: rear left screw
screw4: 225,225
screw4_name: rear right screw
speed: 350
horizontal_move_z: 12