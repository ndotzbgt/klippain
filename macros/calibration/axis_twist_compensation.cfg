#############################################
########## AXIS TWIST COMPENSATION ##########
#############################################
# Convenience macros for the [axis_twist_compensation] module and its
# dockable probe aware calibration wizard.
# See docs/features/axis_twist_compensation.md for more information.

# CALIBRATE_AXIS_TWIST is the recommended way to calibrate the axis twist
# compensation: it first levels the bed (QGL or Z tilt depending on the
# machine) and then runs the calibration wizard.
# It accepts the same parameters as the wizard: AXIS=X|Y and SAMPLE_COUNT=.
[gcode_macro CALIBRATE_AXIS_TWIST]
description: Level the bed and calibrate the axis twist compensation
gcode:
    {% set probe_type_enabled = printer["gcode_macro _USER_VARIABLES"].probe_type_enabled %}
    {% set probe_can_dock = probe_type_enabled == "dockable" or probe_type_enabled == "dockable_virtual" %}

    # Home the printer first
    _CG28

    # Level the bed before measuring the axis twist
    _TILT_CALIBRATE

    # If an error happens during the wizard, dock the probe before stopping
    {% if probe_can_dock %}
        SET_GCODE_VARIABLE MACRO=_PROBE_ON_ERROR_ACTION VARIABLE=probing VALUE=True
    {% endif %}

    # Run the dockable probe aware calibration wizard
    AXIS_TWIST_COMPENSATION_CALIBRATE {% for p in params %}{'%s=%s ' % (p, params[p])}{% endfor %}

    {% if probe_can_dock %}
        SET_GCODE_VARIABLE MACRO=_PROBE_ON_ERROR_ACTION VARIABLE=probing VALUE=False
    {% endif %}

    RESPOND MSG="Axis twist compensation calibrated. Run SAVE_CONFIG and then perform a bed mesh (BED_MESH_CALIBRATE) to apply it."


# QUERY_AXIS_TWIST_COMPENSATION displays the current compensation state:
# the saved z_compensations / zy_compensations and the ranges over which they
# are applied.
[gcode_macro QUERY_AXIS_TWIST_COMPENSATION]
description: Display the current axis twist compensation values
gcode:
    {% set atc = printer["configfile"].config.get('axis_twist_compensation', {}) %}
    {% set z_comp = atc.get('z_compensations', '') %}
    {% set zy_comp = atc.get('zy_compensations', '') %}
    {% set start_x = atc.get('compensation_start_x', '') %}
    {% set end_x = atc.get('compensation_end_x', '') %}
    {% set start_y = atc.get('compensation_start_y', '') %}
    {% set end_y = atc.get('compensation_end_y', '') %}

    RESPOND MSG="Axis twist compensation X (z_compensations): {z_comp}"
    {% if start_x != '' %}
        RESPOND MSG="Axis twist compensation X is applied from {start_x} to {end_x} mm"
    {% endif %}
    RESPOND MSG="Axis twist compensation Y (zy_compensations): {zy_comp}"
    {% if start_y != '' %}
        RESPOND MSG="Axis twist compensation Y is applied from {start_y} to {end_y} mm"
    {% endif %}
    {% if z_comp == '' and zy_comp == '' %}
        RESPOND MSG="Axis twist compensation is not calibrated yet. Run CALIBRATE_AXIS_TWIST to calibrate it."
    {% endif %}