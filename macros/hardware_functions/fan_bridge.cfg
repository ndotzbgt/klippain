## OrcaSlicer fan bridge: Orca addresses the "Auxiliary Part Cooling Fan" as M106 P2 (Marlin standard),
## which Klipper does not support natively. This file uses rename_existing, which requires a [fan]
## section to be present. It is included from part_fan.cfg and part_fan_tachometer.cfg.
##
## For machines using a toolhead board template (e.g. BTT EBB, Mellow SHT) that defines its own
## [fan] section, the fallback M106/M107 in aux_fan.cfg handle P2 routing automatically. If you
## also need bare M106/M107 to forward to the native part fan, add this include in your
## printer.cfg after your toolhead board include:
##   [include macros/hardware_functions/fan_bridge.cfg]

[gcode_macro M106]
description: Set fan speed (OrcaSlicer compatible, P2 = auxiliary fan)
rename_existing: M106.1
gcode:
    {% set aux_fan_enabled = printer["gcode_macro _USER_VARIABLES"].aux_fan_enabled|default(False) %}
    {% set aux_fan_name = printer["gcode_macro _USER_VARIABLES"].aux_fan_name|default("aux_fan") %}
    {% set fan_index = params.P|int if params.P is defined else 0 %}

    {% if fan_index == 2 and aux_fan_enabled %}
        {% set speed = (params.S|float if params.S is defined else 255) / 255 %}
        SET_FAN_SPEED FAN={aux_fan_name} SPEED={speed}
    {% else %}
        M106.1 {rawparams|trim}
    {% endif %}


[gcode_macro M107]
description: Turn off fans (OrcaSlicer compatible, P2 = auxiliary fan)
rename_existing: M107.1
gcode:
    {% set aux_fan_enabled = printer["gcode_macro _USER_VARIABLES"].aux_fan_enabled|default(False) %}
    {% set aux_fan_name = printer["gcode_macro _USER_VARIABLES"].aux_fan_name|default("aux_fan") %}
    {% set fan_index = params.P|int if params.P is defined else 0 %}

    {% if fan_index == 2 and aux_fan_enabled %}
        SET_FAN_SPEED FAN={aux_fan_name} SPEED=0
    {% else %}
        M107.1
    {% endif %}
