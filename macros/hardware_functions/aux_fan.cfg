## Auxiliary fan control macros, used in conjunction with config/hardware/fans/aux_fan.cfg
## The aux fan is an independent secondary part cooling fan, controllable by:
##   - START_AUX_FAN / STOP_AUX_FAN macros
##   - SET_FAN_SPEED FAN=aux_fan
##   - OrcaSlicer "Auxiliary Part Cooling Fan" via the M106 P2 / M107 P2 bridge below

[gcode_macro START_AUX_FAN]
description: Turn on the auxiliary fan at a given speed (SPEED as 0.0 - 1.0)
gcode:
    {% set SPEED = params.SPEED|default(1)|float %}
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose|default(False) %}
    {% set aux_fan_name = printer["gcode_macro _USER_VARIABLES"].aux_fan_name|default("aux_fan") %}

    SET_FAN_SPEED FAN={aux_fan_name} SPEED={SPEED}
    {% if verbose %}
        RESPOND MSG="Auxiliary fan set to {SPEED * 100}%"
    {% endif %}


[gcode_macro STOP_AUX_FAN]
description: Turn off the auxiliary fan
gcode:
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose|default(False) %}
    {% set aux_fan_name = printer["gcode_macro _USER_VARIABLES"].aux_fan_name|default("aux_fan") %}

    SET_FAN_SPEED FAN={aux_fan_name} SPEED=0
    {% if verbose %}
        RESPOND MSG="Auxiliary fan off"
    {% endif %}


[delayed_gcode _STOP_AUX_FAN_DELAYED]
gcode:
    {% set aux_fan_tach_enabled = printer["gcode_macro _USER_VARIABLES"].aux_fan_tach_enabled|default(False) %}
    STOP_AUX_FAN
    {% if aux_fan_tach_enabled %}
        UPDATE_DELAYED_GCODE ID=_BACKGROUND_AUX_TACHO_CHECK DURATION=0
    {% endif %}


# Monitoring loop for the auxiliary fan safety check (only used with a tachometer)
[delayed_gcode _BACKGROUND_AUX_TACHO_CHECK]
gcode:
    _AUX_FAN_CHECK
    UPDATE_DELAYED_GCODE ID=_BACKGROUND_AUX_TACHO_CHECK DURATION=3

[gcode_macro _AUX_FAN_CHECK]
description: Check the auxiliary fan tachometer to verify that it is running effectively
variable_aux_stop_count: 0
gcode:
    {% set max_consecutive_stops = 3 %}
    {% set aux_fan_name = printer["gcode_macro _USER_VARIABLES"].aux_fan_name|default("aux_fan") %}
    {% set aux_fan = "fan_generic " ~ aux_fan_name %}
    {% set rpm = printer[aux_fan].rpm|float %}
    {% set aux_target = printer[aux_fan].speed|float %}
    {% set min_rpm = 1000|float %} # Minimum RPM to detect stoppage (hardcoded threshold)
    {% set aux_stop_count = printer["gcode_macro _AUX_FAN_CHECK"].aux_stop_count|int %}

    {% if (aux_target > 0) and (rpm < min_rpm) %}
        SET_GCODE_VARIABLE MACRO=_AUX_FAN_CHECK VARIABLE=aux_stop_count VALUE={aux_stop_count + 1}
        RESPOND MSG="Auxiliary fan stoppage detected for {(aux_stop_count+1)*3}sec (max {max_consecutive_stops*3}sec allowed)"
        M400
        {% if printer["gcode_macro _AUX_FAN_CHECK"].aux_stop_count|int >= max_consecutive_stops - 1 %}
            CANCEL_PRINT
        {% endif %}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_AUX_FAN_CHECK VARIABLE=aux_stop_count VALUE=0
    {% endif %}


# OrcaSlicer fan bridge: Orca addresses the "Auxiliary Part Cooling Fan" as M106 P2 (Marlin standard),
# which Klipper does not support natively. P0 and bare M106/M107 are forwarded to the part fan ([fan])
# via SET_FAN_SPEED, which is equivalent to the native M106/M107 command. The 'fan' in printer guard
# ensures this works even when no [fan] section is configured (e.g. Chube conduction hotends).
[gcode_macro M106]
description: Set fan speed (OrcaSlicer compatible, P2 = auxiliary fan)
gcode:
    {% set aux_fan_enabled = printer["gcode_macro _USER_VARIABLES"].aux_fan_enabled|default(False) %}
    {% set aux_fan_name = printer["gcode_macro _USER_VARIABLES"].aux_fan_name|default("aux_fan") %}
    {% set fan_index = params.P|int if params.P is defined else 0 %}
    {% set speed = (params.S|float if params.S is defined else 255) / 255 %}

    {% if fan_index == 2 and aux_fan_enabled %}
        SET_FAN_SPEED FAN={aux_fan_name} SPEED={speed}
    {% elif 'fan' in printer %}
        SET_FAN_SPEED FAN=fan SPEED={speed}
    {% endif %}


[gcode_macro M107]
description: Turn off fans (OrcaSlicer compatible, P2 = auxiliary fan)
gcode:
    {% set aux_fan_enabled = printer["gcode_macro _USER_VARIABLES"].aux_fan_enabled|default(False) %}
    {% set aux_fan_name = printer["gcode_macro _USER_VARIABLES"].aux_fan_name|default("aux_fan") %}
    {% set fan_index = params.P|int if params.P is defined else 0 %}

    {% if fan_index == 2 and aux_fan_enabled %}
        SET_FAN_SPEED FAN={aux_fan_name} SPEED=0
    {% elif 'fan' in printer %}
        SET_FAN_SPEED FAN=fan SPEED=0
    {% endif %}
