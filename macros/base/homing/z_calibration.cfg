[gcode_macro CALIBRATE_Z]
rename_existing: _BASE_CALIBRATE_Z
description: Perform the Z calibration using the physical Z endstop and the dockable probe
gcode:
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}
    {% set bed_mesh_enabled = printer["gcode_macro _USER_VARIABLES"].bed_mesh_enabled %}
    {% set status_leds_control_enabled = printer["gcode_macro _USER_VARIABLES"].status_leds_control_enabled|default(False) %}

    {% if not 'xyz' in printer.toolhead.homed_axes %}
        { action_raise_error("Must Home printer first!") }
    {% endif %}

    # Home Z again right before calibrating. Z_TILT_ADJUST (and any other
    # bed movement) shifts the physical Z endstop switch relative to the
    # last homing, so a homing reference taken before that movement makes
    # CALIBRATE_Z measure against a stale bed position and suggest a wrong
    # position_endstop. G28 Z re-anchors the coordinate system on the
    # current switch height, so the measurement and the suggestion stay
    # consistent with the bed as it is now. START_PRINT already homes Z
    # in the right order; this keeps the manual sequence safe as well.
    G28 Z

    {% if status_leds_control_enabled %}
        STATUS_LEDS COLOR="CALIBRATING_Z"
    {% endif %}

    {% if verbose %}
        RESPOND MSG="Auto Z calibration..."
    {% endif %}

    {% if verbose %}
        { action_respond_info("Z Offset calibration") }
    {% endif %}

    # Go to z probe avoiding dock
    _GOTO_Z_PROBE

    # If there is a bed_mesh enabled and a zero_reference_position set, we retrieve it to calibrate Z on it (using probe offsets)
    # Else, we default to the center of the bed
    # The is none guard keeps a missing [bed_mesh] section from raising an
    # Undefined error before the option can be tested.
    {% set bed_mesh_config = printer["configfile"].config["bed_mesh"]|default(None) %}
    {% if not bed_mesh_enabled or bed_mesh_config is none or "zero_reference_position" not in bed_mesh_config %}
        _BASE_CALIBRATE_Z
    {% else %}
        {% set ZRPx, ZRPy = bed_mesh_config["zero_reference_position"].split(',')|map('trim')|map('float') %}
        _BASE_CALIBRATE_Z BED_POSITION="{ZRPx},{ZRPy}"
    {% endif %}

    {% if status_leds_control_enabled %}
        STATUS_LEDS COLOR="READY"
    {% endif %}
